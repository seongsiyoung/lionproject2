server:
  port: 8080
  forward-headers-strategy: framework   # ALB의 X-Forwarded-* 헤더 신뢰

spring:
  application:
    name: lionproject2-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  batch:
    jdbc:
      initialize-schema: never

redisson:
  address: ${REDISSON_ADDRESS:rediss://${spring.data.redis.host}:${spring.data.redis.port}}

portone:
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  api-secret: ${PORTONE_API_SECRET}

payment:
  inicis:
    mid: ${INICIS_MID}
    signkey: ${INICIS_SIGNKEY}
    ini-api-key: ${INICIS_API_KEY}
    ini-api-iv: ${INICIS_API_IV}

jwt:
  secret: ${JWT_SECRET}
  access-exp-ms: 1800000     # 30분
  refresh-exp-ms: 604800000  # 7일

app:
  cookie:
    refresh-name: "refreshToken"
    refresh-path: "/"
    refresh-same-site: "None"   # cross-origin 필수
    refresh-secure: true        # HTTPS 필수
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:5173}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

# ALB Health Check용 Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

notification:
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}

lesson-file:
  s3:
    bucket: ${LESSON_FILE_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    pending-prefix: pending
    validated-prefix: validated
    failed-prefix: failed
  cloudfront:
    domain: ${LESSON_FILE_CLOUDFRONT_DOMAIN}
    key-pair-id: ${LESSON_FILE_CLOUDFRONT_KEY_PAIR_ID}
    private-key-path: ${LESSON_FILE_CLOUDFRONT_PRIVATE_KEY_PATH}
