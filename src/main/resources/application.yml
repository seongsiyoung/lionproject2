spring:
  application:
    name: lionproject2-backend

  profiles:
    active: local

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

redisson:
  address: ${REDISSON_ADDRESS:redis://${spring.data.redis.host}:${spring.data.redis.port}}
  username: ${REDISSON_USERNAME:}
  password: ${REDISSON_PASSWORD:${spring.data.redis.password:}}
  database: ${REDISSON_DATABASE:0}
  timeout: ${REDISSON_TIMEOUT_MS:3000}
  connect-timeout: ${REDISSON_CONNECT_TIMEOUT_MS:10000}
  idle-connection-timeout: ${REDISSON_IDLE_CONNECTION_TIMEOUT_MS:10000}
  retry-attempts: ${REDISSON_RETRY_ATTEMPTS:3}
  retry-interval: ${REDISSON_RETRY_INTERVAL_MS:1500}
  connection-pool-size: ${REDISSON_CONNECTION_POOL_SIZE:24}
  connection-minimum-idle-size: ${REDISSON_CONNECTION_MIN_IDLE_SIZE:8}
  threads: ${REDISSON_THREADS:16}
  netty-threads: ${REDISSON_NETTY_THREADS:32}

lesson-file:
  upload:
    max-size-bytes: ${LESSON_FILE_MAX_SIZE_BYTES:52428800}
    presigned-expire-minutes: ${LESSON_FILE_PRESIGNED_EXPIRE_MINUTES:10}
    download-expire-minutes: ${LESSON_FILE_DOWNLOAD_EXPIRE_MINUTES:10}
    max-material-count: ${LESSON_FILE_MAX_MATERIAL_COUNT:10}
    max-assignment-count: ${LESSON_FILE_MAX_ASSIGNMENT_COUNT:10}
    pending-expire-scan-delay-ms: ${LESSON_FILE_PENDING_EXPIRE_SCAN_DELAY_MS:86400000}
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
    allowed-extensions:
      - pdf
      - png
      - jpg
      - jpeg
  s3:
    bucket: ${LESSON_FILE_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    pending-prefix: ${LESSON_FILE_S3_PENDING_PREFIX:pending}
    validated-prefix: ${LESSON_FILE_S3_VALIDATED_PREFIX:validated}
    failed-prefix: ${LESSON_FILE_S3_FAILED_PREFIX:failed}
  cloudfront:
    domain: ${LESSON_FILE_CLOUDFRONT_DOMAIN:}
    key-pair-id: ${LESSON_FILE_CLOUDFRONT_KEY_PAIR_ID:}
    private-key-path: ${LESSON_FILE_CLOUDFRONT_PRIVATE_KEY_PATH:}

portone:
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  api-secret: ${PORTONE_API_SECRET}

payment:
  inicis:
    mid: ${INICIS_MID:INIpaytest}
    signkey: ${INICIS_SIGNKEY:SU5JTElURV9URVNUX1NJR05LRVk=}
    ini-api-key: ${INICIS_API_KEY:test}
    ini-api-iv: ${INICIS_API_IV:HYb3yQ4f65QL89==}
